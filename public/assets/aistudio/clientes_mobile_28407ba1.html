  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&amp;family=Spline+Sans+Mono&amp;family=Titillium+Web:wght@600;700&amp;display=swap" rel="stylesheet">

  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-light-background text-light-on-background font-body antialiased">
  <div class="min-h-[884px] flex flex-col justify-between bg-light-background" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Dark Navy Top Header (Shell Parity) -->
    <header class="bg-brand-navy text-on-brand-navy px-gutter-lg py-gutter-md flex items-center justify-between gap-gutter-sm">
      <div class="flex items-center gap-gutter-sm">
        <span class="material-symbols-outlined text-brand-gold text-[24px]" aria-hidden="true">balance</span>
        <span data-design-text-token="headline-md" class="font-headline text-headline-md tracking-wider uppercase text-on-brand-navy">ESCRITÓRIO JN</span>
      </div>
      <div class="flex items-center gap-gutter-sm">
        <button type="button" aria-label="Notificações" class="relative p-gutter-xs text-on-brand-navy hover:text-brand-gold-pill transition-colors duration-state-change">
          <span class="material-symbols-outlined text-[22px]" aria-hidden="true">notifications</span>
          <!-- COMPONENT: badge-dot -->
          <span data-component-id="badge-dot" data-component-type="badge" data-component-variant="dot" role="status" aria-label="Novas notificações" class="w-2 h-2 rounded-full bg-badge-red absolute top-1 right-1"></span>
        </button>
        <button type="button" aria-label="Perfil do usuário" class="w-8 h-8 rounded-full bg-brand-navy-elevated border border-brand-gold-border flex items-center justify-center text-brand-gold-pill">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">person</span>
        </button>
        <button type="button" aria-label="Abrir menu" class="p-gutter-xs text-on-brand-navy hover:text-brand-gold-pill transition-colors duration-state-change">
          <span class="material-symbols-outlined text-[24px]" aria-hidden="true">menu</span>
        </button>
      </div>
    </header>

    <!-- Main Content (Single-Screen Fit, No External Scroll) -->
    <main class="flex-1 px-gutter-lg py-gutter-md flex flex-col gap-gutter-md">

      <!-- Back + Sub-tabs -->
      <div class="flex flex-col gap-gutter-sm">
        <a href="#inicio" class="inline-flex items-center gap-gutter-xs text-light-on-surface-variant hover:text-light-on-surface self-start">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">arrow_back</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm">Voltar ao início</span>
        </a>

        <div class="inline-flex items-center gap-gutter-xs bg-inner-panel p-gutter-xs rounded-md border border-light-outline-variant self-start" role="tablist" aria-label="Visualização">
          <button type="button" role="tab" aria-selected="true" class="inline-flex items-center gap-gutter-xs px-gutter-md py-gutter-xs rounded-sm bg-light-surface text-light-on-surface shadow-sm">
            <span class="material-symbols-outlined text-[16px]" aria-hidden="true">group</span>
            <span data-design-text-token="label-md" class="font-label text-label-md">Clientes</span>
          </button>
          <button type="button" role="tab" aria-selected="false" class="inline-flex items-center gap-gutter-xs px-gutter-md py-gutter-xs rounded-sm text-light-on-surface-variant hover:text-light-on-surface transition-colors duration-state-change">
            <span class="material-symbols-outlined text-[16px]" aria-hidden="true">landscape</span>
            <span data-design-text-token="body-sm" class="font-body text-body-sm">Imóveis rurais</span>
          </button>
        </div>
      </div>

      <!-- Page Heading -->
      <div class="flex flex-col gap-gutter-xs">
        <span data-design-text-token="label-sm" class="font-label text-label-sm uppercase tracking-wider text-light-secondary">ESCRITÓRIO JN</span>
        <h1 data-component-id="typography-display" data-component-type="typography" data-component-variant="display" data-design-text-token="headline-lg-mobile" class="font-headline text-headline-lg-mobile text-light-on-surface">Clientes</h1>
        <p data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">Cadastre e consulte as fichas do escritório.</p>
      </div>

      <!-- Search + Actions -->
      <section class="flex flex-col gap-gutter-sm border-b border-light-outline-variant pb-gutter-md">
        <div class="flex flex-col gap-gutter-xs">
          <label for="search-clients-mobile" data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface">Buscar por nome, CPF ou CNPJ</label>
          <div class="flex items-center gap-gutter-sm">
            <input id="search-clients-mobile" type="search" aria-label="Buscar por nome, CPF ou CNPJ" class="w-full rounded-md border border-light-outline-variant bg-light-surface px-gutter-md py-gutter-sm font-body text-body-sm text-light-on-surface focus:border-brand-navy focus:outline-none focus:ring-2 focus:ring-brand-navy/20">
            <button type="button" aria-label="Buscar cliente" class="w-9 h-9 shrink-0 rounded-full border border-light-outline-variant bg-light-surface flex items-center justify-center text-light-on-surface">
              <span class="material-symbols-outlined text-[18px]" aria-hidden="true">search</span>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-gutter-sm">
          <button type="button" aria-label="Atualizar lista" class="w-9 h-9 shrink-0 rounded-full border border-light-outline-variant bg-light-surface flex items-center justify-center text-light-on-surface">
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">refresh</span>
          </button>
          <!-- COMPONENT: button-action-md -->
          <button data-component-id="button-action-md" data-component-type="button" data-component-variant="primary" type="button" class="flex-1 inline-flex items-center justify-center gap-gutter-xs px-gutter-md py-gutter-sm rounded-md bg-brand-navy text-on-brand-navy hover:bg-brand-navy-elevated transition-colors duration-state-change">
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">add</span>
            <span data-design-text-token="label-md" class="font-label text-label-md">Novo cliente</span>
          </button>
        </div>
      </section>

    </main>

    <!-- Sticky Bottom Navigation (Shell Parity) -->
    <nav aria-label="Navegação inferior" class="sticky bottom-0 z-20 bg-light-surface border-t border-light-outline-variant px-gutter-sm py-gutter-sm grid grid-cols-4 gap-gutter-xs">
      <a href="#inicio" class="flex flex-col items-center justify-center gap-gutter-xs text-light-on-surface-variant py-gutter-xs hover:text-brand-navy transition-colors duration-state-change">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">home</span>
        <span data-design-text-token="body-sm" class="font-body text-body-sm">Início</span>
      </a>
      <a href="#solicitacoes" class="flex flex-col items-center justify-center gap-gutter-xs text-light-on-surface-variant py-gutter-xs hover:text-brand-navy transition-colors duration-state-change">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">description</span>
        <span data-design-text-token="body-sm" class="font-body text-body-sm">Solicitações</span>
      </a>
      <a href="#clientes" class="flex flex-col items-center justify-center gap-gutter-xs text-brand-navy py-gutter-xs">
        <span class="material-symbols-outlined text-[22px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">group</span>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Clientes</span>
      </a>
      <a href="#configuracoes" class="flex flex-col items-center justify-center gap-gutter-xs text-light-on-surface-variant py-gutter-xs hover:text-brand-navy transition-colors duration-state-change">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">settings</span>
        <span data-design-text-token="body-sm" class="font-body text-body-sm">Configurações</span>
      </a>
    </nav>

  </div>


</body></html>
